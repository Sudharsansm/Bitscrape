# NOTE: not live-cluster-tested in this build environment -- see
# deployment.yaml's header note. Requires the metrics-server addon (for CPU-
# based scaling) or a Prometheus adapter (for the custom crawl-queue-depth
# metric) to be installed on your cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bitscrape-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bitscrape-worker
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # avoid flapping down during brief lulls
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Custom metric example (requires a Prometheus adapter exposing this
    # from bitscrape_requests_total / queue depth): scale on actual crawl
    # backlog, not just CPU -- the more realistic signal for a crawler.
    # Uncomment once your adapter is configured:
    # - type: Pods
    #   pods:
    #     metric:
    #       name: bitscrape_frontier_queue_depth
    #     target:
    #       type: AverageValue
    #       averageValue: "500"
