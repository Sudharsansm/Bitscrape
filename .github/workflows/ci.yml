name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bitscrape_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install every optional extra (not just "dev"): several test modules
          # import rich, redis, aiosqlite, asyncpg, networkx, langgraph,
          # prometheus-client, opentelemetry, etc. Installing only ".[dev]"
          # leaves those imports missing and the suite fails to even collect.
          pip install -e ".[all,dev]"

      - name: Run tests
        run: pytest tests/ --cov=bitscrape --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
        continue-on-error: true

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        # Pinned to the exact same version as the "dev" extra in
        # pyproject.toml so lint results can't drift when a new ruff
        # release changes default rule behavior (this previously broke
        # CI: ruff 0.16.x reformats/reorders imports differently than
        # the 0.15.22 the code was written against).
        run: pip install "ruff==0.15.22"

      - name: Check lint
        # The package source lives under src/bitscrape (see
        # [tool.setuptools.packages.find] in pyproject.toml), there is no
        # top-level bitscrape/ directory, so linting "bitscrape/" always
        # failed with "No such file or directory".
        run: ruff check src/bitscrape/

      - name: Check formatting
        run: ruff format --check src/bitscrape/

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions with twine
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 7