name: Docker build

# Builds deploy/Dockerfile on every push/PR so a broken Dockerfile fails CI
# the same as any other regression -- it had existed since before this
# release but nothing actually built it. Does NOT push the image anywhere
# by default (per project policy: only GitHub + PyPI are published to
# right now). If you later want an image published automatically on
# release the way Scrapling does, uncomment the "push" step's `push: true`
# line and the registry-login step below, and make sure `packages: write`
# permission and a registry destination are set up first.

on:
  push:
    branches: [main]
    paths:
      - "deploy/Dockerfile"
      - "pyproject.toml"
      - "src/**"
  pull_request:
    paths:
      - "deploy/Dockerfile"
      - "pyproject.toml"
      - "src/**"

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Log in to GitHub Container Registry
      #   if: github.event_name != 'pull_request'
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build slim image (no browsers)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          push: false
          tags: bitscrape:ci-slim
          cache-from: type=gha,scope=slim
          cache-to: type=gha,mode=max,scope=slim

      - name: Build image with all browsers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: browsers
          push: false # flip to `github.event_name != 'pull_request'` once you want to publish
          tags: bitscrape:ci
          load: true
          cache-from: type=gha,scope=browsers
          cache-to: type=gha,mode=max,scope=browsers

      - name: Smoke-test the browsers image
        run: |
          docker run --rm --entrypoint python bitscrape:ci -c \
            "import asyncio, bitscrape; from playwright.async_api import async_playwright
          async def m():
              async with async_playwright() as p:
                  b = await p.chromium.launch(); await b.close()
          asyncio.run(m()); print('chromium ok, bitscrape', bitscrape.__version__)"

      - name: Validate docker-compose config
        run: docker compose -f deploy/docker-compose.yml config

