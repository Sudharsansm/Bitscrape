[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitscrape"
version = "0.8.0"
description = "A modern, production-grade async web scraping framework (patched fork: robots.txt, queue-crash, proxy, and infinite-scroll fixes)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Bitscrape Contributors" }]
requires-python = ">=3.11"
keywords = ["scraping", "crawler", "async", "pydantic", "playwright", "spider"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "selectolax>=0.3",
    "parsel>=1.9",
    "lxml>=5.0",
    "click>=8.1",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
redis = ["redis>=5.0", "orjson>=3.9"]
cli = ["rich>=13.0"]
storage-sqlite = ["aiosqlite>=0.19"]
storage-postgres = ["asyncpg>=0.29"]
storage-s3 = ["boto3>=1.34"]
storage-mongo = ["motor>=3.4"]
workflow = ["langgraph>=0.2"]
monitoring = ["psutil>=5.9"]
knowledge-graph = ["networkx>=3.2", "numpy>=1.26", "scipy>=1.11"]
observability = [
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=5.0",
    "mypy==2.3.0",
    "ruff==0.15.22",
    "moto[s3]==5.2.2",
    "pyyaml==6.0.3",
    "mongomock-motor>=0.0.29",
]
all = [
    "playwright>=1.40",
    "redis>=5.0",
    "orjson>=3.9",
    "rich>=13.0",
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
    "boto3>=1.34",
    "motor>=3.4",
    "langgraph>=0.2",
    "psutil>=5.9",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]

[project.scripts]
bitscrape = "bitscrape.cli.main:cli"

[project.urls]
Homepage = "https://github.com/Sudharsansm/Bitscrape"
Repository = "https://github.com/Sudharsansm/Bitscrape"
Issues = "https://github.com/Sudharsansm/Bitscrape/issues"
Changelog = "https://github.com/Sudharsansm/Bitscrape/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bitscrape = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx.*", "asyncpg.*", "boto3.*", "psutil.*", "parsel.*", "langgraph.*", "numpy.*", "scipy.*", "motor.*", "mongomock_motor.*"]
ignore_missing_imports = true
